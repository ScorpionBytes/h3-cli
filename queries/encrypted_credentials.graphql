query {
    encrypted_credentials {
        ...EncryptedCredentialFragment
    }
}

fragment EncryptedCredentialFragment on EncryptedCredential {
    uuid
    key_type
    principal_name
    runner {
        ...AgentFragment
    }
}

fragment AgentFragment on Agent {
    name
    uname
    last_heartbeat_at
    last_heartbeat_time_ago
}

