mutation m(
    $op_id: String! 
    $encrypted_credential_uuid: String! 
    $encrypted_secret: String! 
) {
    inject_encrypted_credential(
        op_id:$op_id
        encrypted_credential_uuid: $encrypted_credential_uuid
        encrypted_secret: $encrypted_secret
    ) {
        encrypted_credential {
            ...EncryptedCredentialFragment
        }
    }
}

fragment EncryptedCredentialFragment on EncryptedCredential {
    uuid
    key_type
    username
    ip
    aws_access_key_id
}