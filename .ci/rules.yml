.merge:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: always
    - when: never

.deploy-stage:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

.deploy-production:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}\.\d+$/
      when: always
    - when: never

.deploy-public:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}\.\d+$/
      when: manual
    - when: never
