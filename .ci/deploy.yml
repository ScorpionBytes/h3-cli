# After merging to main, we want to update the public branch to then get mirrored to github.
push-to-public-branch:
  stage: deploy
  needs:
    - production-deploy
  image:
    name: $NXRM_DOCKER_REGISTRY_URL/gerber:latest
    pull_policy: always
  before_script:
    # Set up git settings
    - git config --global user.email "ci_bot@horizon3.com"
    - git config --global user.name "ci_bot"

    # Set up git remote for public branch
    - git remote set-url origin "https://gitlab-ci-token:${MERGE_TO_PUBLIC_TOKEN}@${CI_PROJECT_URL#https://}.git"
  script:
    # Fetch branches we are going to work with
    - git fetch origin main
    - git fetch origin public

    # Ensure we are on the main branch
    - git checkout main
    - git pull origin main

    # Create new branch to merge into public
    - TIMESTAMP=$(date +%Y%m%d%H%M%S)
    - BRANCH_NAME="public-$TIMESTAMP"
    - git checkout -b $BRANCH_NAME

    # Remove CI/CD files and folders
    - git rm -rf argocd
    - git rm -rf .gitlab-ci.yml
    - git rm -rf Dockerfile
    - git rm -rf .ci
    - git rm -rf mcp/requirements.txt
    - git rm -rf mcp/server.py
    - git commit -m "Release h3-cli $TIMESTAMP"

    # This is to ensure that the public branch only has the latest release without a commit history.
    - git checkout public
    - git merge $(git commit-tree -p public -m "Release $CI_COMMIT_TAG" $BRANCH_NAME^{tree})

    # Push to public branch
    - git push origin public

  rules:
    - !reference [.deploy-public, rules]
