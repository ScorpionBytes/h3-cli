query {
    auto_injected_credentials {
        ...AutoInjectedCredentialFragment
    }
}

fragment AutoInjectedCredentialFragment on AutoInjectedCredential {
    uuid
    key_type
    principal_name
    runner {
        ...AgentFragment
    }
}

fragment AgentFragment on Agent {
    name
    uname
    last_heartbeat_at
    last_heartbeat_time_ago
}

