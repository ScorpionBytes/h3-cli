query q($search: String = "", $page_num: Int = 1, $page_size: Int = 20) {
    asset_groups_count(
        page_input:{
            text_search:$search
        }
    )
    asset_groups_page(
        page_input:{
            page_num:$page_num,
            page_size:$page_size,
            text_search:$search
            order_by:"last_ead_etl_completed_at"
            sort_order:DESC
        }
    ) {
        asset_groups {
            ...AssetGroupFragment
        }
    }
}

fragment AssetGroupFragment on AssetGroup {
    uuid
    name
    op_template {
        schedule_op_form {
            osint_domains
            op_param_max_scope
            git_accounts {
                name 
                source 
                type
            }
            aws_account_ids
        }
    }
    user_account_name
    client_account_company_name
    last_ead_etl_completed_at
    created_at
    updated_at
    op_series_uuid
    assets_count
    pentestable_assets_count
    external_domain_xops_count
    pentestable_external_domain_xops_count
    in_scope_host_tab_xops_count
    pentestable_host_tab_xops_count
}
